# Publishing a release on GitHub (Releases → Draft a new release → new tag like v0.2.0, target
# main) builds rarityscape-<version>.zip with that version and attaches it to the release.
# "Run workflow" on the Actions tab makes a test build (plugin.json's version) as a downloadable
# artifact.
name: Build

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v7
      - name: Lua syntax (as in check.yml)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.4 && luac5.4 -p $(git ls-files '*.lua')
      - run: bash build.sh "$TAG"
      - uses: actions/upload-artifact@v7
        with:
          name: rarityscape
          path: dist/*.zip
      - name: Attach to release
        if: github.event_name == 'release'
        run: gh release upload "$TAG" dist/*.zip --clobber
        env:
          GH_TOKEN: ${{ github.token }}
