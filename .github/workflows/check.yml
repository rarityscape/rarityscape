# Every push and pull request: every Lua file must compile with Lua 5.4, the game's version.
name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lua-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.4
      - run: luac5.4 -p $(git ls-files '*.lua')
